<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020"><meta name="description" content="SNS AI — private offline local AI workspace">
<link rel="manifest" href="/static/manifest.json"><link rel="icon" href="/static/logo.svg">
<title>SNS AI — Local AI</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--panel2:#eef2f8;--text:#111827;--muted:#64748b;--line:#dbe2ea;--accent:#f28c28;--accent2:#2563eb;--danger:#dc2626;--code:#111827;--shadow:0 10px 30px #0f172a12}
[data-theme=dark]{--bg:#050816;--panel:#0b1020;--panel2:#121a2d;--text:#edf2ff;--muted:#94a3b8;--line:#23304a;--code:#020617;--shadow:0 12px 35px #0008}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}button,input,textarea{font:inherit}.app{display:grid;grid-template-columns:270px 1fr;height:100vh}.side{background:var(--panel);border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:14px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}.brand img{width:36px;height:36px}.new{width:100%;padding:11px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;cursor:pointer}.chats{overflow:auto;flex:1}.chatitem{padding:10px 11px;border-radius:10px;cursor:pointer;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chatitem.active,.chatitem:hover{background:var(--panel2);color:var(--text)}.sidefoot{font-size:12px;color:var(--muted);line-height:1.5}.main{display:flex;flex-direction:column;min-width:0}.top{height:64px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:space-between;padding:0 18px}.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}.dot{width:8px;height:8px;border-radius:50%;background:#f59e0b}.dot.ok{background:#22c55e}.actions{display:flex;gap:8px}.iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;padding:8px 10px;cursor:pointer}.workspace{display:grid;grid-template-columns:1fr 320px;flex:1;min-height:0}.chat{display:flex;flex-direction:column;min-width:0}.messages{overflow:auto;flex:1;padding:26px clamp(16px,6vw,80px)}.welcome{max-width:760px;margin:8vh auto;text-align:center}.welcome img{width:64px}.welcome h1{font-size:36px;margin:12px 0 6px}.welcome p{color:var(--muted)}.bubble{max-width:820px;margin:0 auto 20px}.role{font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:700}.content{line-height:1.65;white-space:pre-wrap}.user .content{background:var(--panel2);padding:12px 15px;border-radius:14px}.composer{padding:14px clamp(12px,6vw,80px);background:linear-gradient(transparent,var(--bg) 20%)}.box{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:16px;padding:10px}.box textarea{width:100%;resize:none;min-height:56px;max-height:180px;border:0;outline:0;background:transparent;color:var(--text)}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.select{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:9px;padding:7px}.send{background:var(--accent2);color:white;border:0;border-radius:10px;padding:9px 14px;cursor:pointer}.panel{border-left:1px solid var(--line);background:var(--panel);padding:16px;overflow:auto}.panel h3{margin:4px 0 12px}.card{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:12px;margin-bottom:12px}.card label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}.card input{width:100%;padding:9px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px}.drop{border:1px dashed var(--line);padding:18px;text-align:center;border-radius:10px;color:var(--muted);cursor:pointer}.doc{font-size:12px;padding:8px 0;border-bottom:1px solid var(--line)}.tool{display:grid;gap:7px}.tool textarea{width:100%;min-height:70px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px}.tool button{padding:8px;border:0;background:var(--accent);color:#111;border-radius:8px;cursor:pointer}.hidden{display:none}@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.workspace{grid-template-columns:1fr}.panel{display:none}.welcome h1{font-size:28px}}
</style></head>
<body>
<div class="app">
<aside class="side"><div class="brand"><img src="/static/logo.svg">SNS AI</div><button class="new" onclick="newChat()">＋ New chat</button><div class="chats" id="chats"></div><div class="sidefoot">Private • Local • No login<br>AI runs on your device.</div></aside>
<main class="main"><header class="top"><div><b id="modeTitle">SNS AI</b><div class="status"><span class="dot" id="dot"></span><span id="status">Checking local model…</span></div></div><div class="actions"><button class="iconbtn" onclick="toggleTheme()">☾/☀</button><button class="iconbtn" onclick="togglePanel()">☷</button></div></header>
<div class="workspace"><section class="chat"><div class="messages" id="messages"><div class="welcome"><img src="/static/logo.svg"><h1>Local AI, privately.</h1><p>Chat, code, search your local documents and use offline tools. No account required.</p></div></div><div class="composer"><div class="box"><textarea id="prompt" placeholder="Message SNS AI…" onkeydown="key(event)"></textarea><div class="row"><select class="select" id="mode"><option value="chat">Chat</option><option value="coding">Coding</option></select><button class="send" onclick="send()">Send ↵</button></div></div></div></section>
<aside class="panel" id="panel"><h3>Workspace</h3><div class="card"><b>Documents</b><div class="drop" onclick="document.getElementById('files').click()">Drop or choose files<br><small>PDF, DOCX, TXT, MD, code</small></div><input id="files" class="hidden" type="file" multiple onchange="upload()"><div id="docs"></div></div><div class="card"><b>Local tools</b><div class="tool"><textarea id="toolInput" placeholder="Calculator: 12*18\nJSON: {&quot;a&quot;:1}\nStats: text"></textarea><select class="select" id="toolType"><option value="calculator">Calculator</option><option value="json">JSON formatter</option><option value="stats">Text statistics</option></select><button onclick="runTool()">Run tool</button><pre id="toolOut" style="white-space:pre-wrap"></pre></div></div><div class="card"><b>Runtime</b><div id="runtime">Loading…</div></div></aside>
</div></main></div>
<script>
let cid=null;
const $=id=>document.getElementById(id);
async function api(url,opt){let r=await fetch(url,opt);let j=await r.json();if(!r.ok)throw Error(j.detail||'Request failed');return j}
async function health(){try{let x=await api('/api/health');$('dot').className='dot '+(x.llm?'ok':'');$('status').textContent=x.llm?'Local model ready':(x.model_present?'Starting model…':'Add a GGUF model to models/');$('runtime').textContent=`Model: ${x.model}\nLoaded: ${x.llm?'yes':'no'}`}catch(e){$('status').textContent='Backend unavailable'}}
async function loadChats(){let xs=await api('/api/conversations');$('chats').innerHTML=xs.map(x=>`<div class="chatitem ${x.id==cid?'active':''}" onclick="openChat(${x.id})">${esc(x.title)}</div>`).join('')}
async function openChat(id){cid=id;let x=await api('/api/conversations/'+id);$('messages').innerHTML=x.messages.map(m=>bubble(m.role,m.content)).join('');loadChats();scroll()}
function bubble(role,text){return `<div class="bubble ${role==='user'?'user':''}"><div class="role">${role==='user'?'You':'SNS AI'}</div><div class="content">${esc(text)}</div></div>`}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function send(){let p=$('prompt').value.trim();if(!p)return;$('prompt').value='';if(document.querySelector('.welcome'))$('messages').innerHTML='';$('messages').insertAdjacentHTML('beforeend',bubble('user',p));scroll();let typing='⏳ Thinking locally…';$('messages').insertAdjacentHTML('beforeend',`<div class="bubble" id="typing"><div class="role">SNS AI</div><div class="content">${typing}</div></div>`);scroll();try{let x=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversation_id:cid,message:p,mode:$('mode').value,use_documents:true})});cid=x.conversation_id;$('typing').outerHTML=bubble('assistant',x.answer);await loadChats()}catch(e){$('typing').outerHTML=bubble('assistant','Error: '+e.message)}scroll()}
function newChat(){cid=null;$('messages').innerHTML='<div class="welcome"><img src="/static/logo.svg"><h1>Local AI, privately.</h1><p>Chat, code, search your local documents and use offline tools.</p></div>';loadChats()}
function key(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}}
function scroll(){let x=$('messages');x.scrollTop=x.scrollHeight}
async function upload(){let fs=$('files').files;if(!fs.length)return;let f=new FormData();for(let x of fs)f.append('files',x);try{await api('/api/documents',{method:'POST',body:f});await docs()}catch(e){alert(e.message)}}
async function docs(){let xs=await api('/api/documents');$('docs').innerHTML=xs.map(x=>`<div class="doc">📄 ${esc(x.name)}<br><small>${x.chars} chars</small></div>`).join('')}
async function runTool(){try{let x=await api('/api/tools',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tool:$('toolType').value,input:$('toolInput').value})});$('toolOut').textContent=x.result||JSON.stringify(x,null,2)}catch(e){$('toolOut').textContent=e.message}}
function toggleTheme(){document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'':'dark';localStorage.theme=document.documentElement.dataset.theme}
function togglePanel(){let p=$('panel');p.style.display=p.style.display==='none'?'block':''}
if(localStorage.theme==='dark')document.documentElement.dataset.theme='dark';
health();loadChats();docs();setInterval(health,5000);
</script></body></html>
